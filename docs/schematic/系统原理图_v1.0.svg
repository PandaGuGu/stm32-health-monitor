  <line x1="885" y1="620" x2="1030" y2="620" stroke="#1b1f24" stroke-width="2.6" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="957" y="612" text-anchor="middle" font-size="10.5" fill="#5b6570">I²C2</text>

