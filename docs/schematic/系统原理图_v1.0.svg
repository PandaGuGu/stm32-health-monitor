  <line x1="460" y1="719" x2="520" y2="719" stroke="#1b1f24" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="532" y="723" font-size="10.5" fill="#5b6570">GPIO 单向控制</text>

  <line x1="740" y1="719" x2="800" y2="719" stroke="#1b1f24" stroke-width="2" stroke-dasharray="10 4 2 4"/>
