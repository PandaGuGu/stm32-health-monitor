  <rect x="1020" y="707" width="46" height="24" rx="4" fill="#faefd9" stroke="#8a682a" stroke-width="1"/>
  <text x="1043" y="723" text-anchor="middle" font-size="9" font-family="Consolas, monospace" fill="#6b4f1d">3V3</text>
  <text x="1078" y="723" font-size="10.5" fill="#5b6570">电源网络标签</text>

  <text x="1330" y="786" text-anchor="end" font-size="10" fill="#5b6570">v1.0 · 2026-10-17 · 依据 HARDWARE 层实际配置绘制</text>

  <text x="700" y="850" text-anchor="middle" font-size="14" font-weight="500">图 1  STM32F103C8T6 健康监测仪系统原理图</text>
  <text x="700" y="874" text-anchor="middle" font-size="11" fill="#5b6570">注：引脚分配依据固件 HARDWARE 层实际配置；软件 I²C 为 GPIO 开漏模拟，I²C2 为 AF 开漏复用，上拉电阻由各模块板载提供。</text>
  <text x="700" y="894" text-anchor="middle" font-size="11" fill="#5b6570">图上箭头表示数据流向，双向箭头为双向总线；系统实现心率/血氧、体温、体动与跌倒四项监测，OLED 本地显示、蜂鸣器声光报警。</text>
</svg>
