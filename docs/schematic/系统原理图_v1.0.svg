<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" width="1400" height="920" role="img">
  <title>STM32F103C8T6 健康监测仪系统原理图</title>
  <desc>以 STM32F103C8T6 为控制核心的健康监测仪系统原理图，包含电源域、OLED 显示、MAX30102 心率血氧、MPU6050 六轴、DS18B20 体温、有源蜂鸣器与 SWD 调试接口，标注各路总线类型与引脚分配。</desc>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#1b1f24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="920" fill="#ffffff"/>
  <rect x="40" y="40" width="1320" height="760" fill="none" stroke="#1b1f24" stroke-width="1.2"/>

  <text x="700" y="72" text-anchor="middle" font-size="12" fill="#5b6570">健康监测仪 · 系统原理图 / System Block Diagram</text>
  <line x1="560" y1="82" x2="840" y2="82" stroke="#c3c8ce" stroke-width="0.8"/>

