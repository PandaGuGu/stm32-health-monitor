  <text x="1050" y="394" font-size="10.5" fill="#5b6570">I²C 0x3C · 软件模拟</text>

  <rect x="1030" y="454" width="300" height="84" rx="6" fill="#ddf0e8" stroke="#2a6a59" stroke-width="1"/>
  <text x="1050" y="480" font-size="13" font-weight="500">U2  MAX30102</text>
  <text x="1050" y="500" font-size="10.5" fill="#5b6570">心率 / 血氧 PPG · I²C 0x57</text>
  <text x="1050" y="518" font-size="10.5" fill="#5b6570">RED 660 nm · IR 880 nm</text>

  <rect x="1030" y="578" width="300" height="84" rx="6" fill="#ddf0e8" stroke="#2a6a59" stroke-width="1"/>
  <text x="1050" y="604" font-size="13" font-weight="500">U3  MPU6050</text>
  <text x="1050" y="624" font-size="10.5" fill="#5b6570">六轴 IMU · I²C 0x68 · ±16 g</text>

