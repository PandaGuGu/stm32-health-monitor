  <text x="96" y="154" font-size="10.5" fill="#5b6570">USB 5 V / 适配器</text>

  <line x1="236" y1="142" x2="264" y2="142" stroke="#1b1f24" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="272" y="110" width="180" height="64" rx="6" fill="#faefd9" stroke="#8a682a" stroke-width="1"/>
  <text x="288" y="134" font-size="12.5" font-weight="500">U6  AMS1117-3.3</text>
  <text x="288" y="154" font-size="10.5" fill="#5b6570">LDO · 800 mA · 3.3 V</text>

  <path d="M452 142 H494 V192 H500" fill="none" stroke="#8a682a" stroke-width="1.6"/>
  <rect x="500" y="180" width="100" height="24" rx="4" fill="#faefd9" stroke="#8a682a" stroke-width="1"/>
  <text x="550" y="196" text-anchor="middle" font-size="11" font-weight="500" font-family="Consolas, monospace" fill="#6b4f1d">VCC_3V3</text>
  <text x="614" y="196" font-size="10.5" fill="#5b6570">供 MCU 与全部外设（GND 公共）</text>

  <rect x="515" y="250" width="370" height="410" rx="8" fill="#dde8f5" stroke="#2e5c8a" stroke-width="1.4"/>
