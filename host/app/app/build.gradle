plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sit.esp32info'
    compileSdk 35

    defaultConfig {
        applicationId "com.sit.esp32info"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 调试阶段用 debug 签名，adb install 即可；正式发布再换 keystore
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
