plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sit.vitals'
    compileSdk 35

    defaultConfig {
        applicationId "com.sit.vitals"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 课程演示用 debug 签名，adb install 即可；对外分发再换正式 keystore
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
